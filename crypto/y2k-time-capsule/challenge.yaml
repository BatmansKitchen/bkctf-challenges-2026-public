name: "Y2K Time Capsule"
description: |-
  To prevent against important data being lost before y2k, researchers made a time capsule using state of the art technology. 
  However after y2k came and went and nothing happened, the time capsule was lost to time. 

  Now, we've dug this time capsule back up and need your help to break back in and get the secrets that lie within.

